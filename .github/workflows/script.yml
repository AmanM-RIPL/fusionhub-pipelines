name: Frontend Qt Build Pipeline

on:
  push:
    branches:
      - fusionhub-QT-frontend
      # - main
  pull_request:
    branches:
      - fusionhub-QT-frontend
      # - main
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest        # ← No self-hosted needed!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.5 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.5.0 gcc_64 -O $HOME/Qt
          echo "$HOME/Qt/6.5.0/gcc_64/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=$HOME/Qt/6.5.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HOME/Qt/6.5.0/gcc_64 \
            -G "Ninja"

      - name: Build
        run: cmake --build build --config Release --parallel

      # - name: List build output
      #  run: ls -la build/

