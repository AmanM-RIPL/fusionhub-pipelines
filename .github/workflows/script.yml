name: Frontend Qt Build Pipeline

on:
  push:
    branches:
      - fusionhub-QT-frontend
      # - main
  pull_request:
    branches:
      - fusionhub-QT-frontend
      # - main
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.5 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.5.0 win64_msvc2019_64 -O C:\Qt `
            -m qtcharts qtnetworkauth qt5compat qtmultimedia
          echo "C:\Qt\6.5.0\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "Qt6_DIR=C:\Qt\6.5.0\msvc2019_64\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell

      - name: Install CMake & Ninja
        run: choco install cmake ninja --installargs 'ADD_CMAKE_TO_PATH=System' -y
        shell: powershell

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.5.0\msvc2019_64" `
            -G "Ninja"
        shell: powershell

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: powershell

      - name: List build output
        run: dir build\
        shell: powershell

      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
