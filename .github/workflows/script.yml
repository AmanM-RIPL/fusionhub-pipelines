name: Build Pipeline

on:
  push:
    branches: [ github-action ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # - name: Install cross-env
      #   run: npm install -g cross-env

      # - name: Run tests
      #   run: npx cross-env NODE_ENV=test npx jest --silent=false

      - name: Build
        run: npm run build
